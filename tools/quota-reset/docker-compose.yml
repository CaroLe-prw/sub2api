services:
  quota-reset:
    build:
      context: .
      dockerfile: Dockerfile
    image: sub2api-quota-reset:local
    container_name: sub2api-quota-reset
    restart: unless-stopped
    env_file:
      - path: ./quota-reset.env
        required: false
    environment:
      STATE_FILE: /data/subscription-daily-quota-reset-state.json
    volumes:
      - quota_reset_state:/data
    networks:
      - infra

volumes:
  quota_reset_state:
    driver: local

networks:
  infra:
    external: true
    name: infra_infra-network
